<!-- Carvalho & Seixas · cenas de imóvel.
     Ilustração da marca para o lugar da fotografia que ainda não chegou. É
     desenho assumido, não foto falsa: geometria chapada, paleta da marca e
     uma única entrada de ouro por cena, que é sempre a luz acesa.

     Cada símbolo carrega `preserveAspectRatio="xMidYMid slice"`, então a cena
     preenche e recorta o encaixe como uma foto faria, em qualquer proporção.
     A cor sai de propriedade personalizada de propósito: propriedade cruza a
     árvore de sombra do `<use>`, classe de CSS não cruza. -->
<svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">

